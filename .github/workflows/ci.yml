name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep the newest validation authoritative while avoiding billed runner time on
# commits that have already been superseded in the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tyfino_test
          POSTGRES_USER: tyfino
          POSTGRES_PASSWORD: tyfino_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyfino -d tyfino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tyfino:tyfino_test_password@127.0.0.1:5432/tyfino_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug application
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload development debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tyfino-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android-instrumentation:
    name: android-instrumentation (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone-api-27
            task: phoneApi27DebugAndroidTest
          - device: tablet-api-35
            task: tabletApi35DebugAndroidTest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android Emulator
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator"
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run managed-device instrumentation
        run: >-
          ./gradlew --no-daemon --stacktrace :app:${{ matrix.task }}
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload instrumentation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-${{ matrix.device }}
          path: |
            apps/android/app/build/reports/androidTests/managedDevice/debug
            apps/android/app/build/outputs/androidTest-results/managedDevice
          if-no-files-found: ignore
