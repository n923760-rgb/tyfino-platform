name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep the newest validation authoritative while avoiding billed runner time on
# commits that have already been superseded in the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate engineering environment manifest
        run: bash governance/scripts/validate-engineering-environment.sh
      - name: Validate Task / Result protocol
        run: bash governance/scripts/validate-task-result-protocol.sh
      - name: Validate deployment configuration and scripts
        run: |
          cp .env.example .env
          bash -n infrastructure/server/bootstrap-ubuntu.sh
          bash -n infrastructure/server/deploy-preproduction.sh
          docker compose config --format json > /tmp/tyfino-compose.json
          jq -e '
            (.services.api.environment | has("POSTGRES_PASSWORD") | not) and
            (.services.api.environment | has("POSTGRES_APP_PASSWORD") | not) and
            (.services.caddy.environment | keys | sort == ["ADMIN_DOMAIN", "API_DOMAIN", "ROOT_DOMAIN"])
          ' /tmp/tyfino-compose.json

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tyfino_test
          POSTGRES_USER: tyfino_owner
          POSTGRES_PASSWORD: tyfino_owner_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyfino_owner -d tyfino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tyfino_app:tyfino_app_test_password@127.0.0.1:5432/tyfino_test
      TEST_OWNER_DATABASE_URL: postgresql://tyfino_owner:tyfino_owner_test_password@127.0.0.1:5432/tyfino_test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: tyfino_owner
      PGPASSWORD: tyfino_owner_test_password
      POSTGRES_DB: tyfino_test
      POSTGRES_USER: tyfino_owner
      POSTGRES_APP_USER: tyfino_app
      POSTGRES_APP_PASSWORD: tyfino_app_test_password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Initialize schema and simulate an overprivileged existing role
        run: |
          psql "$TEST_OWNER_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=../../database/init/001_schema.sql
          psql "$TEST_OWNER_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tyfino_legacy_power NOLOGIN;
          CREATE ROLE tyfino_app LOGIN PASSWORD 'temporary_overprivileged_password';
          CREATE SCHEMA tyfino_legacy_owned AUTHORIZATION tyfino_app;
          GRANT tyfino_legacy_power TO tyfino_app;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO tyfino_app;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO tyfino_app;
          GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO tyfino_app;
          INSERT INTO audit_logs (action, entity_type, metadata)
          VALUES ('migration.seed', 'database', '{"preserve":true}'::jsonb);
          SQL
      - name: Migrate and verify the restricted application role
        run: |
          if ../../database/init/002_app_role.sh; then
            echo "Role migration unexpectedly accepted application-owned objects" >&2
            exit 1
          fi
          psql "$TEST_OWNER_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="DROP SCHEMA tyfino_legacy_owned"
          ../../database/init/002_app_role.sh
          ../../database/init/002_app_role.sh
          psql "$TEST_OWNER_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF pg_has_role('tyfino_app', 'tyfino_legacy_power', 'MEMBER') THEN
              RAISE EXCEPTION 'application role retained inherited legacy privileges';
            END IF;
            IF has_table_privilege('tyfino_app', 'audit_logs', 'UPDATE')
               OR has_table_privilege('tyfino_app', 'audit_logs', 'DELETE')
               OR has_table_privilege('tyfino_app', 'activation_codes', 'DELETE') THEN
              RAISE EXCEPTION 'application role retained forbidden table privileges';
            END IF;
            IF NOT has_column_privilege('tyfino_app', 'audit_logs', 'action', 'INSERT')
               OR NOT has_table_privilege('tyfino_app', 'activation_codes', 'SELECT') THEN
              RAISE EXCEPTION 'application role is missing required runtime privileges';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM audit_logs
               WHERE action = 'migration.seed' AND metadata = '{"preserve":true}'::jsonb
            ) THEN
              RAISE EXCEPTION 'role migration did not preserve existing data';
            END IF;
          END
          $$;
          SQL
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  database-backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tyfino_backup_source
          POSTGRES_USER: tyfino_owner
          POSTGRES_PASSWORD: tyfino_owner_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyfino_owner -d tyfino_backup_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tyfino_owner:tyfino_owner_test_password@127.0.0.1:5432/tyfino_backup_source
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: tyfino_owner
      PGPASSWORD: tyfino_owner_test_password
      POSTGRES_DB: tyfino_backup_source
      POSTGRES_USER: tyfino_owner
      POSTGRES_APP_USER: tyfino_app
      POSTGRES_APP_PASSWORD: tyfino_app_test_password
      RESTORE_DATABASE: tyfino_restore_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize representative database
        run: |
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=database/init/001_schema.sql
          database/init/002_app_role.sh
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command="INSERT INTO audit_logs (action, entity_type, metadata) VALUES ('backup.seed', 'database', '{\"source\":\"ci\"}'::jsonb)"
      - name: Prove application role cannot bypass audit protection
        run: |
          if PGUSER="$POSTGRES_APP_USER" PGPASSWORD="$POSTGRES_APP_PASSWORD" psql --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 --command="UPDATE audit_logs SET action = 'forbidden'"; then
            echo "Restricted application role unexpectedly updated audit_logs" >&2
            exit 1
          fi
          if PGUSER="$POSTGRES_APP_USER" PGPASSWORD="$POSTGRES_APP_PASSWORD" psql --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 --command="ALTER TABLE audit_logs DISABLE TRIGGER audit_logs_append_only"; then
            echo "Restricted application role unexpectedly altered audit protection" >&2
            exit 1
          fi
      - name: Create validated backup
        run: |
          backup_directory=$(mktemp -d)
          echo "BACKUP_FILE=$backup_directory/tyfino.dump" >> "$GITHUB_ENV"
          database/scripts/create-backup.sh "$backup_directory/tyfino.dump"
      - name: Restore and verify backup
        run: database/scripts/verify-backup-restore.sh "$BACKUP_FILE"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug application
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Build optimized unsigned release
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload development debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tyfino-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android-instrumentation:
    name: android-instrumentation (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone-api-27
            task: phoneApi27DebugAndroidTest
          - device: tablet-api-35
            task: tabletApi35DebugAndroidTest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android Emulator
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator"
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run managed-device instrumentation
        run: >-
          ./gradlew --no-daemon --stacktrace :app:${{ matrix.task }}
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload instrumentation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-${{ matrix.device }}
          path: |
            apps/android/app/build/reports/androidTests/managedDevice/debug
            apps/android/app/build/outputs/androidTest-results/managedDevice
          if-no-files-found: ignore
