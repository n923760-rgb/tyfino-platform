name: Build signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-apk-release
  cancel-in-progress: false

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    environment: production-apk
    defaults:
      run:
        working-directory: apps/android
    env:
      TYFINO_ANDROID_KEYSTORE_BASE64: ${{ secrets.TYFINO_ANDROID_KEYSTORE_BASE64 }}
      TYFINO_ANDROID_STORE_PASSWORD: ${{ secrets.TYFINO_ANDROID_STORE_PASSWORD }}
      TYFINO_ANDROID_KEY_ALIAS: ${{ secrets.TYFINO_ANDROID_KEY_ALIAS }}
      TYFINO_ANDROID_KEY_PASSWORD: ${{ secrets.TYFINO_ANDROID_KEY_PASSWORD }}
      TYFINO_ANDROID_CERT_SHA256: ${{ secrets.TYFINO_ANDROID_CERT_SHA256 }}
      TYFINO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tyfino-release.p12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
      - name: Materialize protected signing key
        run: |
          for name in \
            TYFINO_ANDROID_KEYSTORE_BASE64 \
            TYFINO_ANDROID_STORE_PASSWORD \
            TYFINO_ANDROID_KEY_ALIAS \
            TYFINO_ANDROID_KEY_PASSWORD \
            TYFINO_ANDROID_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "Required release secret is missing: ${name}" >&2
              exit 1
            fi
          done
          printf '%s' "$TYFINO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$TYFINO_ANDROID_KEYSTORE_PATH"
          chmod 600 "$TYFINO_ANDROID_KEYSTORE_PATH"
      - name: Build optimized signed APK
        run: ./gradlew --no-daemon :app:assembleRelease -PTYFINO_SIGN_RELEASE=true
      - name: Verify signing certificate and package
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          mkdir -p build/release-output
          "$apksigner_path" verify --verbose --print-certs "$apk_path" | tee build/release-output/certificate.txt
          actual_fingerprint="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2); exit}' build/release-output/certificate.txt | tr -d ':[:space:]')"
          expected_fingerprint="$(printf '%s' "$TYFINO_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$actual_fingerprint"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Signing certificate fingerprint does not match the approved release key." >&2
            exit 1
          fi
          cp "$apk_path" build/release-output/TYFINO-1.0.0.apk
          sha256sum build/release-output/TYFINO-1.0.0.apk > build/release-output/TYFINO-1.0.0.apk.sha256
      - name: Upload signed APK for owner review
        uses: actions/upload-artifact@v4
        with:
          name: tyfino-signed-apk-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/android/build/release-output
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove materialized signing key
        if: always()
        run: rm -f "$TYFINO_ANDROID_KEYSTORE_PATH"
